# Shared Prometheus, Grafana, and pushgateways.
# Each suite under benchmarks/suites/<app>/ includes this file, maps host ports,
# and mounts its own prometheus.yml.
# Grafana: admin / 123 (suite default only).
#
# No host ports here. Compose merges the `ports` list on include rather than
# replacing it, so a mapping declared here is published in addition to the
# suite's own and two suites cannot run side by side.
# Port mapping belongs to the suite. See benchmarks/docs/PORTS.md.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pushgateway-ecs
      - pushgateway-ec2
      - pushgateway-lambda
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "123"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  pushgateway-ecs:
    image: prom/pushgateway:v1.10.0
    networks:
      - monitoring

  pushgateway-ec2:
    image: prom/pushgateway:v1.10.0
    networks:
      - monitoring

  pushgateway-lambda:
    image: prom/pushgateway:v1.10.0
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge

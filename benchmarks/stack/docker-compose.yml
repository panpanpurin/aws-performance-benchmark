# Shared Prometheus, Grafana, and pushgateways.
# Each suite under benchmarks/suites/<app>/ includes this file, maps host ports,
# and mounts its own prometheus.yml.
# Grafana: admin / 123 (suite default only).

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pushgateway-ecs
      - pushgateway-ec2
      - pushgateway-lambda
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "123"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  pushgateway-ecs:
    image: prom/pushgateway:v1.10.0
    ports:
      - "9092:9091"
    networks:
      - monitoring

  pushgateway-ec2:
    image: prom/pushgateway:v1.10.0
    ports:
      - "9093:9091"
    networks:
      - monitoring

  pushgateway-lambda:
    image: prom/pushgateway:v1.10.0
    ports:
      - "9094:9091"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge

# AniLove suite: ports 9090 / 3002 / 9092-9094
# App metric scrapes go through host.docker.internal:18080/18081
# (run: node scripts/anilove-metrics-proxy.js for EC2/ECS Host headers).
name: anilove-benchmark

include:
  - path: ../../stack/docker-compose.yml

services:
  prometheus:
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    ports:
      - "3002:3000"
    volumes:
      - ../../stack/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro

  pushgateway-ecs:
    ports:
      - "9092:9091"

  pushgateway-ec2:
    ports:
      - "9093:9091"

  pushgateway-lambda:
    ports:
      - "9094:9091"

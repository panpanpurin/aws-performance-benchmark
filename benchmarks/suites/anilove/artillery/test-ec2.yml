config:
  target: "https://REPLACE_ME"
  phases:
  # Measured by pilot 20260810-054832, phase 2 only (the first 60 s is
  # discarded). Service time and the resulting one-worker ceiling:
  #   EC2 2.47 ms -> 405 req/s   ECS 2.46 ms -> 406 req/s
  #   Lambda 6.19 ms -> 162 req/s   <- binding
  #   Lambda is read from CloudWatch Duration, not the in-app timer: a
  #   concurrency slot is held for the whole invocation. The in-app 3.92 ms
  #   would overstate the ceiling as 255 req/s.
  #
  # FIVE requests per arrival: arrivalCount is one fifth of the request rate.
  # arrivalCount, not arrivalRate: a rate starts every user of a second at once.
  #
  # Primary at 50% of Lambda's ceiling, as in csv-processor, so latency is not
  # measured over survivors only. Each arrival fires five back-to-back
  # invocations, so loss starts earlier here than in the single-request suites:
  # the pilot returned 2 502s in 1800 requests at 12% occupancy.

    # Warm-up at the primary rate. Discarded.
    - duration: 180
      arrivalCount: 2880

    # Probe, 4.5 arrivals/s = 22.5 req/s, 14% of Lambda's ceiling, 6% of EC2/ECS.
    - duration: 360
      arrivalCount: 1620

    # Probe, 9 arrivals/s = 45 req/s, 28% / 11%.
    - duration: 360
      arrivalCount: 3240

    # Primary, 16 arrivals/s = 80 req/s, 50% / 20%. Source of every reported
    # figure; 57600 requests.
    - duration: 720
      arrivalCount: 11520

    # Probe, 23 arrivals/s = 115 req/s, 71% / 28%. Closest approach to the knee.
    # A throttled Lambda behind the ALB returns 502, not 429; count 502s or read
    # CloudWatch Throttles. Loss here is a result, report it.
    - duration: 360
      arrivalCount: 8280

  defaults:
    headers:
      Content-Type: application/json
      Host: anilove-ec2.bench.local
    http:
      timeout: 60

  plugins:
    publish-metrics:
      - type: prometheus
        pushgateway: "http://localhost:9093"
        testName: "anilove-load-test"
        environment: "production"
        labels:
          service: "anilove-service"
          scenario: "animes-crud"
          instance: ec2

scenarios:
  - name: Animes CRUD
    flow:
      # 1) Create an anime
      - post:
          url: "/animes"
          capture:
            - json: "$.id"      # Captures the ID returned by the POST request
              as: "animeId"
          json:
            title: "Anime_{{ $randomNumber(1,9999) }}_{{ $timestamp }}_{{ $uuid }}"
            genre: ["Action", "Fantasy"]
            episodes: "{{ $randomNumber(12, 50) }}"
            note: "{{ $randomNumber(1, 10) }}"

      # 2) List all anime
      - get:
          url: "/animes"

      # 3) Search for the created anime (using captured ID)
      - get:
          url: "/animes/{{ animeId }}"

      # 4) Update the anime
      - put:
          url: "/animes/{{ animeId }}"
          json:
            title: "Anime_Updated_{{ $randomNumber(1, 9999) }}_{{ $uuid }}"
            genre: ["Adventure"]
            episodes: 24
            note: 9

      # 5) Delete the created anime
      - delete:
          url: "/animes/{{ animeId }}"

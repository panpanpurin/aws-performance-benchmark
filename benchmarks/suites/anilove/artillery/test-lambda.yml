config:
  target: "https://REPLACE_ME"
  phases:
  # Pilot 20260810-054832 for service time, calibration run 20260810-070037 for
  # the loss curve. Service time per request, pilot phase 2:
  #   EC2 2.47 ms   ECS 2.46 ms   Lambda 3.92 ms in-app / 6.19 ms CloudWatch
  #
  # The Lambda ceiling is NOT 1000/6.19. One arrival is a five-step sequential
  # flow, so what saturates the single concurrency slot is how many virtual users
  # hold an invocation at once, not invocation throughput. Flow time is
  # 5 x 25.2 ms client-side = 126 ms, so one worker absorbs 7.9 arrivals/s:
  #   Lambda 40 req/s   <- binding
  #   EC2 405 req/s, ECS 406 req/s, which are throughput-bound, not flow-bound
  #
  # Loss measured on 20260810-070037. EC2 and ECS were 0% at every rate:
  #   22.5 req/s 1.6%   45 req/s 6.1%   80 req/s 26.4%   115 req/s 40.2%
  # That run set the primary at 80 req/s, from the Duration ceiling of 162 req/s
  # that this suite does not obey. It lost a quarter of the requests and pulled
  # Lambda's mean *down* to 3.60 ms, below the uncontended 3.92 ms, because only
  # survivors are timed. Do not raise these rates without re-measuring loss.
  #
  # At the primary EC2 and ECS sit near 5% of their own ceiling. One rate cannot
  # saturate three platforms; that asymmetry is what reserved concurrency 1 costs
  # and is the subject of Experiment B.
  #
  # FIVE requests per arrival: arrivalCount is one fifth of the request rate.
  # arrivalCount, not arrivalRate: a rate starts every user of a second at once.

    # Warm-up at the primary rate. Discarded.
    - duration: 120
      arrivalCount: 480

    # Probe, 1.5 arrivals/s = 7.5 req/s, 19% of Lambda's ceiling, 2% of EC2/ECS.
    - duration: 150
      arrivalCount: 225

    # Probe, 2.5 arrivals/s = 12.5 req/s, 32% / 3%.
    - duration: 150
      arrivalCount: 375

    # Primary, 4 arrivals/s = 20 req/s, 51% / 5%. Source of every reported
    # figure; 9600 requests.
    - duration: 480
      arrivalCount: 1920

    # Probe, 5.6 arrivals/s = 28 req/s, 71% / 7%. Closest approach to the knee.
    # A throttled Lambda behind the ALB returns 502, not 429; count 502s or read
    # CloudWatch Throttles. Loss here is a result, report it.
    - duration: 150
      arrivalCount: 840

  defaults:
    headers:
      Content-Type: application/json
      Host: anilove-lambda.bench.local
    http:
      timeout: 60

  plugins:
    publish-metrics:
      - type: prometheus
        pushgateway: "http://localhost:9094"
        testName: "anilove-load-test"
        environment: "production"
        labels:
          service: "anilove-service"
          scenario: "animes-crud"
          instance: lambda

scenarios:
  - name: Animes CRUD
    flow:
      # 1) Create an anime
      - post:
          url: "/animes"
          capture:
            - json: "$.id"      # Captures the ID returned by the POST request
              as: "animeId"
          json:
            title: "Anime_{{ $randomNumber(1,9999) }}_{{ $timestamp }}_{{ $uuid }}"
            genre: ["Action", "Fantasy"]
            episodes: "{{ $randomNumber(12, 50) }}"
            note: "{{ $randomNumber(1, 10) }}"

      # 2) List all anime
      - get:
          url: "/animes"

      # 3) Search for the created anime (using captured ID)
      - get:
          url: "/animes/{{ animeId }}"

      # 4) Update the anime
      - put:
          url: "/animes/{{ animeId }}"
          json:
            title: "Anime_Updated_{{ $randomNumber(1, 9999) }}_{{ $uuid }}"
            genre: ["Adventure"]
            episodes: 24
            note: 9

      # 5) Delete the created anime
      - delete:
          url: "/animes/{{ animeId }}"
   
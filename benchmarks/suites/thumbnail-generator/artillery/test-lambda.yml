config:
  target: "https://REPLACE_ME"
  processor: "./upload-image.js"

  # ============================================================
  # Load test phases for the thumbnail generator. Identical across platforms:
  # - EC2: c6i.large host, container capped at 1 vCPU / 1024 MB
  # - ECS: task 1024 CPU units (1 vCPU) / 1024 MB on a c6i.large
  # - Lambda: 1769 MB (one full vCPU), reserved concurrency 1
  # Every platform serves with exactly one 1-vCPU worker.
  # ============================================================
  phases:
  # Measured by pilot 20260808-183300, phase 2 only (the first 60 s absorbs cold
  # starts and is discarded). Mean service time and the resulting one-worker
  # ceiling:
  #   EC2 77.1 ms -> 13.0 req/s   ECS 79.7 ms -> 12.5 req/s
  #   Lambda 129.0 ms -> 7.8 req/s   <- binding
  #   Lambda is read from CloudWatch Duration, not the in-app timer: a
  #   concurrency slot is held for the whole invocation. The in-app 119.7 ms
  #   understates the duration by 7.2% and would set every phase too high.
  #
  # arrivalCount, not arrivalRate: a rate starts every virtual user of a second
  # at the same instant. One request per arrival, so arrivals == requests.

    # Warm-up at the primary rate. Warming lower leaves a step change whose
    # transient falls inside the reported window. Discarded.
    - duration: 120
      arrivalCount: 600

    # Probe, 1 req/s - 13% of Lambda ceiling, 8% of EC2/ECS.
    - duration: 150
      arrivalCount: 150

    # Probe, 2.5 req/s - 32% / 19%.
    - duration: 150
      arrivalCount: 375

    # Primary operating point, 5 req/s - 65% of Lambda ceiling, 39% of EC2/ECS.
    # Source of every reported figure; 2400 requests.
    - duration: 480
      arrivalCount: 2400

    # Probe, 6.5 req/s - 84% / 50%. Loss here is a result, report it beside
    # latency rather than on its own.
    - duration: 150
      arrivalCount: 975

  defaults:
    headers:
      Host: thumb-lambda.bench.local
    http:
      timeout: 60

  plugins:
    publish-metrics:
      - type: prometheus
        pushgateway: "http://localhost:9294"
        testName: "thumbnail-load-test"
        environment: "production"
        labels:
          service: "thumbnail-service"
          scenario: "upload-formdata"
          instance: lambda

# ============================================================
# Scenarios
# ============================================================
scenarios:
  - name: Upload de imagem via form-data manual
    flow:
      - post:
          url: "/thumbnail?width=200&height=400&format=jpg&quality=80"
          beforeRequest: "buildFormData"

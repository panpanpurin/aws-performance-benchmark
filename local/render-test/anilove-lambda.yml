# GENERATED for the dashboard rendering check, not a measurement: the three
# targets are identical containers sharing one host's CPU and one Postgres.
# The scenario is copied from local/artillery/test-anilove-local.yml.
config:
  target: "http://localhost:3020"
  phases:
    - duration: 30
      arrivalCount: 30
    - duration: 240
      arrivalCount: 480

  defaults:
    headers:
      Content-Type: application/json
    http:
      timeout: 30

  plugins:
    publish-metrics:
      - type: prometheus
        pushgateway: "http://localhost:9094"
        testName: "anilove-render-test"
        environment: "local"
        labels:
          service: "anilove-service"
          scenario: "animes-crud"
          instance: lambda

scenarios:
  - name: Animes CRUD (local)
    flow:
      - post:
          url: "/animes"
          capture:
            - json: "$.id"
              as: "animeId"
          json:
            title: "Anime_{{ $randomNumber(1,9999) }}_{{ $timestamp }}_{{ $uuid }}"
            genre: ["Action", "Fantasy"]
            episodes: "{{ $randomNumber(12, 50) }}"
            note: "{{ $randomNumber(1, 10) }}"

      - get:
          url: "/animes"

      - get:
          url: "/animes/{{ animeId }}"

      - put:
          url: "/animes/{{ animeId }}"
          json:
            title: "Anime_Updated_{{ $randomNumber(1, 9999) }}_{{ $uuid }}"
            genre: ["Adventure"]
            episodes: 24
            note: 9

      - delete:
          url: "/animes/{{ animeId }}"

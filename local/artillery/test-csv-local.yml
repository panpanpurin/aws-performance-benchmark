# Local Docker CSV processor - short phases
config:
  target: "http://localhost:8000"
  processor: "./processor.js"

  phases:
    - duration: 30
      arrivalRate: 2
    - duration: 60
      arrivalRate: 4
    - duration: 30
      arrivalRate: 6
    - duration: 30
      arrivalRate: 2

  defaults:
    http:
      timeout: 60

  plugins:
    publish-metrics:
      - type: prometheus
        pushgateway: "http://localhost:9093"
        testName: "csv-processor-local-load-test"
        environment: "local"
        labels:
          service: "csv-processor-service"
          scenario: "process-csv-formdata"
          instance: local

scenarios:
  - name: Process CSV (local)
    flow:
      - post:
          url: "/process"
          beforeRequest: "buildCsvRequest"
